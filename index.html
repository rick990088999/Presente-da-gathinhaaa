<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0a1e">
<title>Para você ❤️</title>

<!-- Fontes (opcional): se estiver offline, o navegador usa as fontes de reserva e tudo continua funcionando. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Poppins:wght@300;400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   BASE
   ===================================================================== */
:root{
  --plum:#1a0a1e; --wine:#3a1030; --rose:#ff5d8f; --rose2:#ff8fb1; --gold:#ffd9b8; --cream:#fff1ea;
  --serif:'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --pixel:'Press Start 2P','Courier New',ui-monospace,Menlo,Consolas,monospace;
  --display:'Anton',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#12081a;color:#fdeef2;font-family:var(--sans);
  -webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
img{max-width:100%}
.emo{display:inline-block;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}36%{transform:scale(1.14)}48%{transform:scale(1)}}

#stage{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(160deg,#1d0a22 0%,#2b0e2a 45%,#12081a 100%)}
.aurora{position:absolute;inset:-20%;pointer-events:none;filter:blur(24px);transition:opacity 1s;
  background:
    radial-gradient(40% 35% at 20% 25%,rgba(255,93,143,.28),transparent 70%),
    radial-gradient(35% 40% at 80% 70%,rgba(255,170,120,.20),transparent 70%),
    radial-gradient(45% 45% at 60% 10%,rgba(140,90,255,.16),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
#stage[data-mode="retro"] .aurora{opacity:0}
#bg,#top{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:1}
#top{z-index:150}
.gift-spot{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,200,140,.22),transparent 55%),radial-gradient(ellipse at center,transparent 35%,rgba(10,2,14,.6) 100%)}
#stage.gift-mode .gift-spot{opacity:1}

/* ---------- telas e transições ---------- */
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(clamp(20px,5vw,48px) + env(safe-area-inset-top)) clamp(20px,5vw,48px) calc(clamp(20px,5vw,48px) + env(safe-area-inset-bottom))}
.screen.active{display:flex;animation:screenIn .9s ease backwards}
.screen.leaving{opacity:0;filter:blur(10px);transform:scale(1.05);transition:opacity .55s ease,filter .55s ease,transform .55s ease}
@keyframes screenIn{from{opacity:0;filter:blur(10px);transform:scale(.97)}to{opacity:1;filter:blur(0);transform:scale(1)}}

.rise{opacity:0}
.screen.active .rise{animation:rise .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(20px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

#fx{position:fixed;inset:0;z-index:300;pointer-events:none;opacity:0}
#fx.soft{background:radial-gradient(circle at 50% 50%,#3a1030 0%,#160816 75%);animation:fxFade 1.15s ease both}
#fx.dark{background:radial-gradient(circle at 50% 50%,#2a0000 0%,#000 70%);animation:fxFade 1.25s ease both}
#fx.bloom{background:radial-gradient(circle at 50% 50%,#fff 0%,#ffe1ea 35%,#ff8fb1 75%,#c2416f 100%);animation:fxBloom 1.55s ease both}
#fx.glitch{background:#000;animation:fxGlitch 1.35s steps(1,end) both}
@keyframes fxFade{0%{opacity:0}45%,55%{opacity:1}100%{opacity:0}}
@keyframes fxBloom{0%{opacity:0;transform:scale(1.5)}40%{opacity:1;transform:scale(1)}58%{opacity:1}100%{opacity:0}}
@keyframes fxGlitch{
  0%{opacity:0}8%{opacity:.85;background:#ff003c}14%{opacity:.2;background:#00e5ff}22%{opacity:1;background:#000}
  30%{opacity:.6;background:repeating-linear-gradient(0deg,#000 0 3px,#3a0000 3px 6px)}
  38%{opacity:1;background:#000}46%{opacity:.9;background:#ff003c}52%{opacity:1;background:#000}
  60%{opacity:1;background:#000}68%{opacity:.5;background:repeating-linear-gradient(0deg,transparent 0 3px,#000 3px 5px)}
  78%{opacity:.85;background:#00e5ff}86%{opacity:.35;background:#000}100%{opacity:0}}
#flash{position:fixed;inset:0;z-index:290;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),#fff 0%,#ffd9a0 30%,transparent 70%)}
#flash.run{animation:flashOut .7s ease-out both}
@keyframes flashOut{0%{opacity:1}100%{opacity:0}}

/* ---------- botões ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:176px;padding:17px 36px;border-radius:999px;
  font-family:var(--sans);font-weight:600;letter-spacing:.22em;font-size:.92rem;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,#ff6f9c,#e0356b);overflow:hidden;user-select:none;-webkit-user-select:none;
  box-shadow:0 10px 30px rgba(255,80,130,.42),inset 0 1px 0 rgba(255,255,255,.38);
  transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
.btn::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}90%,100%{transform:translateX(120%)}}
@media (hover:hover){.btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 16px 40px rgba(255,80,130,.6),inset 0 1px 0 rgba(255,255,255,.5);filter:brightness(1.06)}}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
.btn:disabled{pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}

.btn-retro{font-family:var(--pixel);font-size:.85rem;letter-spacing:.08em;border-radius:0;padding:20px 30px;color:#ffe9b0;
  background:linear-gradient(#d3301d,#7c1208);border:3px solid #ffb05a;text-shadow:2px 2px 0 #000;
  box-shadow:0 0 0 3px #1a0503,6px 6px 0 #000,inset 0 0 0 2px rgba(0,0,0,.4)}
.btn-retro::after{display:none}
@media (hover:hover){.btn-retro:hover{transform:translate(-2px,-2px);box-shadow:0 0 0 3px #1a0503,9px 9px 0 #000,inset 0 0 0 2px rgba(0,0,0,.4);filter:brightness(1.25)}}
.btn-retro:active{transform:translate(4px,4px);box-shadow:0 0 0 3px #1a0503,2px 2px 0 #000,inset 0 0 0 2px rgba(0,0,0,.4)}
.btn-gold{background:linear-gradient(#ffd766,#c98a10);color:#3a2200;text-shadow:1px 1px 0 rgba(255,255,255,.4);border-color:#fff2b8}

/* ---------- TELA 1: introdução ---------- */
.hello{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(2.6rem,10vw,5.8rem);line-height:1.05;color:var(--cream);
  text-shadow:0 0 50px rgba(255,93,143,.55),0 4px 20px rgba(0,0,0,.4);margin-bottom:1.6rem}
.lead{font-size:clamp(1.05rem,3.4vw,1.5rem);font-weight:500;color:#ffdbe6;letter-spacing:.02em;margin-bottom:.7rem}
.love{font-family:var(--serif);font-style:italic;font-size:clamp(1.6rem,5.5vw,2.6rem);color:#ff9dbb;margin:1rem 0 2.4rem;text-shadow:0 0 30px rgba(255,93,143,.5)}

/* ---------- TELA 2: desafio ---------- */
#s-challenge{background:linear-gradient(160deg,#1d0a22,#2f0f2b 45%,#14091c)}
#s-challenge .c-layer{position:absolute;inset:0;pointer-events:none;opacity:0}
.c-static{background:radial-gradient(ellipse at 50% 45%,#5a0d0d 0%,#1c0303 55%,#050101 100%);transition:opacity 1s steps(7)}
.c-scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.4) 0 2px,transparent 2px 4px);transition:opacity 1s steps(5)}
.c-vig{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.85));transition:opacity 1s steps(5)}
#s-challenge.infected .c-layer{opacity:1}
#s-challenge > *:not(.c-layer){position:relative;z-index:2}
.c-title{position:relative;font-family:var(--display);font-size:clamp(3.4rem,16vw,9rem);letter-spacing:.04em;line-height:.95;text-transform:uppercase;
  color:#ffd6e0;text-shadow:0 0 30px rgba(255,93,143,.5);transition:color .2s,text-shadow .2s;margin-bottom:1.4rem}
.c-title::before,.c-title::after{content:attr(data-text);position:absolute;inset:0;opacity:0;pointer-events:none}
#s-challenge.glitching .c-title::before{color:#00e5ff;opacity:.85;mix-blend-mode:screen;animation:gl1 .45s steps(2) infinite}
#s-challenge.glitching .c-title::after{color:#ff003c;opacity:.85;mix-blend-mode:screen;animation:gl2 .45s steps(2) infinite}
#s-challenge.glitching .c-title{animation:jolt .3s steps(2) 4}
#s-challenge.infected .c-title{color:#ff4a2e;text-shadow:0 0 24px rgba(255,40,20,.85),5px 5px 0 #000;animation:glitchLoop 3.4s infinite}
@keyframes gl1{0%{clip-path:inset(10% 0 60% 0);transform:translate(-5px,0)}50%{clip-path:inset(55% 0 10% 0);transform:translate(5px,0)}100%{clip-path:inset(30% 0 35% 0);transform:translate(-3px,0)}}
@keyframes gl2{0%{clip-path:inset(60% 0 10% 0);transform:translate(5px,0)}50%{clip-path:inset(15% 0 55% 0);transform:translate(-5px,0)}100%{clip-path:inset(40% 0 25% 0);transform:translate(3px,0)}}
@keyframes jolt{0%{transform:translate(0,0) skewX(0)}50%{transform:translate(-6px,2px) skewX(6deg)}100%{transform:translate(5px,-2px) skewX(-5deg)}}
@keyframes glitchLoop{0%,90%,100%{transform:none}92%{transform:translate(-5px,1px) skewX(8deg)}94%{transform:translate(6px,-1px) skewX(-8deg)}96%{transform:translate(-2px,0)}}
.c-text{font-family:var(--pixel);font-size:clamp(.7rem,2.6vw,1rem);line-height:2;color:#ffe9b0;text-shadow:2px 2px 0 #000;max-width:34rem;margin-bottom:2.6rem}

/* ---------- retro geral: ruído/scanlines ---------- */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;animation:grain .6s steps(4) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{background-position:0 0}25%{background-position:-40px 20px}50%{background-position:30px -30px}75%{background-position:-20px -40px}100%{background-position:0 0}}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}

/* ---------- TELA 3: FPS ---------- */
#s-fps{padding:0;background:#000;touch-action:none}
#s-fps.active{display:block}
.fps-wrap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#000}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;transform:scale(1.04);
  transition:filter 1.4s ease;will-change:transform}
#game.dimmed{filter:brightness(.5) saturate(.35) sepia(.4)}
.fps-fx{position:absolute;inset:0;pointer-events:none}
.fps-vig{background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.78) 100%)}
.fps-muzzle{background:radial-gradient(circle at 50% 100%,rgba(255,190,90,.85),transparent 62%);opacity:0}
.fps-hurt{background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,0,.6) 100%);opacity:0}
.fps-gold{background:radial-gradient(circle at 50% 50%,rgba(255,236,150,.9),rgba(255,180,50,.35) 55%,transparent 75%);opacity:0}
.fps-gold.run{animation:goldPulse 1.3s ease-out both}
@keyframes goldPulse{0%{opacity:1}100%{opacity:0}}
#gun{position:absolute;left:50%;bottom:0;width:min(56vw,46vh,380px);aspect-ratio:1;image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none;
  transform:translateX(-50%);will-change:transform}
#crosshair{position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);pointer-events:none;transition:transform .08s,filter .08s;
  --c:#8dff6b;
  background:
    linear-gradient(var(--c),var(--c)) 50% 0/3px 11px no-repeat,
    linear-gradient(var(--c),var(--c)) 50% 100%/3px 11px no-repeat,
    linear-gradient(var(--c),var(--c)) 0 50%/11px 3px no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 50%/11px 3px no-repeat;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.9))}
#crosshair::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--c)}
#crosshair.hit{--c:#ff3b30;transform:translate(-50%,-50%) scale(1.5)}
.hud{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));font-family:var(--pixel);font-size:clamp(.62rem,2.4vw,.95rem);
  color:#ffe9b0;background:rgba(10,2,2,.72);border:2px solid #b3241a;padding:10px 14px;text-shadow:2px 2px 0 #000;box-shadow:4px 4px 0 rgba(0,0,0,.6);pointer-events:none}
.hud b{color:#ff4a2e;font-weight:400;display:inline-block;min-width:1ch}
.hud.pulse{animation:hudPulse .4s ease}
@keyframes hudPulse{0%{transform:scale(1)}40%{transform:scale(1.18);background:rgba(120,10,0,.85)}100%{transform:scale(1)}}
.fps-hint{position:absolute;left:0;right:0;top:calc(max(14px,env(safe-area-inset-top)) + 64px);text-align:center;font-family:var(--pixel);font-size:clamp(.55rem,2vw,.75rem);
  color:#ffe9b0;text-shadow:2px 2px 0 #000;line-height:2;padding:0 16px;pointer-events:none;transition:opacity 1s}
.fire-btn{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));width:clamp(78px,22vw,104px);aspect-ratio:1;border-radius:50%;display:none;
  align-items:center;justify-content:center;font-family:var(--pixel);font-size:.6rem;color:#ffe9b0;text-shadow:2px 2px 0 #000;letter-spacing:.05em;
  background:radial-gradient(circle at 35% 30%,#ff7a5c,#c21807 60%,#6b0a00);border:4px solid #ffb05a;box-shadow:0 0 0 3px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.6);
  touch-action:none;-webkit-user-select:none;user-select:none;z-index:5}
.fire-btn:active,.fire-btn.down{transform:scale(.92);filter:brightness(1.3)}
html.touch .fire-btn{display:flex}
html.touch .fps-wrap{cursor:default}
.letterbox{position:absolute;left:0;right:0;height:0;background:#000;transition:height 1.2s ease;pointer-events:none}
.letterbox.top{top:0}.letterbox.bot{bottom:0}
.fps-wrap.victory .letterbox{height:12vh}

/* ---------- TELA 4: GAME WIN ---------- */
#s-win{background:radial-gradient(ellipse at 50% 40%,#3b2a05 0%,#120a01 55%,#000 100%)}
#s-win > *:not(.grain):not(.scan):not(.stars){position:relative;z-index:2}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.9}
.stars i{position:absolute;width:4px;height:4px;background:#ffe9a0;animation:twinkle 1.6s steps(2) infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.win-title{font-family:var(--display);font-size:clamp(4rem,20vw,11rem);letter-spacing:.04em;line-height:.95;text-transform:uppercase;margin-bottom:3rem;
  background:linear-gradient(#fff6c8 0%,#ffd23f 45%,#ff9a1f 55%,#b34700 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(5px 5px 0 #000) drop-shadow(0 0 30px rgba(255,180,40,.55))}
#s-win.active .win-title{animation:slam .8s cubic-bezier(.2,1.4,.4,1) backwards .15s}
@keyframes slam{0%{transform:scale(3);opacity:0}70%{transform:scale(.96);opacity:1}100%{transform:scale(1)}}

/* ---------- TELA 5: pergunta ---------- */
#s-question{gap:1.1rem}
.q-pre{font-family:var(--serif);font-style:italic;font-size:clamp(1.25rem,4.2vw,2.1rem);color:#ffdbe6;max-width:min(92vw,22ch);line-height:1.35;transition:opacity 1s,transform 1s}
.q-pre.dim{opacity:.6}
.q-title{font-family:var(--serif);font-weight:700;font-style:italic;font-size:clamp(2.3rem,8.5vw,5rem);line-height:1.08;max-width:min(92vw,14ch);
  color:var(--cream);text-shadow:0 0 40px rgba(255,93,143,.6);opacity:0;transform:scale(1.3);filter:blur(14px);transition:all 1.1s cubic-bezier(.2,.8,.2,1)}
.q-title.show{opacity:1;transform:none;filter:none}
.answers{display:flex;gap:1.3rem;align-items:center;justify-content:center;margin-top:1.6rem;opacity:0;transform:translateY(20px);transition:opacity .9s,transform .9s}
.answers.show{opacity:1;transform:none}
.btn-yes.big{animation:yesPulse 1.4s ease-in-out infinite}
@keyframes yesPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.btn-yes.pop{animation:yesPop .7s ease both}
@keyframes yesPop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1.15)}}
.no-slot{position:relative;display:inline-block;transition:width .7s ease,margin-left .7s ease,opacity .4s}
.no-slot.gone{width:0!important;margin-left:-1.3rem}
.no-wrap{position:relative;display:inline-block;will-change:transform}
.no-wrap.free{position:fixed;left:0;top:0;z-index:60}
.no-tilt{position:relative;display:inline-block;transition:transform .25s ease}
.btn-no{background:linear-gradient(135deg,#8b7bb0,#57466f);box-shadow:0 8px 24px rgba(90,60,140,.45),inset 0 1px 0 rgba(255,255,255,.28);transition:background .4s,box-shadow .4s}
.sweat{position:absolute;right:-8px;top:-16px;font-size:1.3rem;opacity:0;pointer-events:none}
.no-wrap[data-level="1"] .btn-no{animation:tremble .2s linear infinite}
.no-wrap[data-level="2"] .btn-no{animation:tremble .13s linear infinite}
.no-wrap[data-level="2"] .sweat,.no-wrap[data-level="3"] .sweat{opacity:1;animation:sweat .8s ease-in infinite}
.no-wrap[data-level="3"] .btn-no{animation:tremble .08s linear infinite;background:linear-gradient(135deg,#ff6b6b,#b3122b);box-shadow:0 0 30px rgba(255,60,60,.75)}
.no-wrap[data-level="doom"] .sweat{opacity:1;animation:sweat .4s ease-in infinite}
.no-wrap[data-level="doom"] .btn-no{animation:doom 1.7s ease-in forwards;background:linear-gradient(135deg,#ff9a3d,#d31111);box-shadow:0 0 40px rgba(255,100,30,.95),0 0 90px rgba(255,40,0,.7)}
.btn-no.dash{animation:dash .3s ease}
@keyframes dash{0%{transform:scale(1)}40%{transform:scale(1.18,.8) skewX(-8deg)}100%{transform:scale(1)}}
@keyframes tremble{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-2deg)}50%{transform:translate(2px,-1px) rotate(2deg)}75%{transform:translate(-1px,-2px) rotate(-1deg)}100%{transform:translate(1px,2px) rotate(1deg)}}
@keyframes sweat{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes doom{
  0%{transform:scale(1) translate(0,0)}8%{transform:scale(1.04) translate(-3px,2px) rotate(-3deg)}16%{transform:scale(1.06) translate(4px,-3px) rotate(3deg)}
  24%{transform:scale(1.09) translate(-5px,3px) rotate(-5deg)}32%{transform:scale(1.12) translate(6px,-4px) rotate(5deg)}
  42%{transform:scale(1.16) translate(-8px,5px) rotate(-7deg)}52%{transform:scale(1.2) translate(9px,-6px) rotate(7deg)}
  62%{transform:scale(1.25) translate(-11px,7px) rotate(-9deg)}72%{transform:scale(1.3) translate(12px,-8px) rotate(9deg)}
  82%{transform:scale(1.36) translate(-14px,9px) rotate(-11deg);filter:brightness(1.4)}92%{transform:scale(1.44) translate(15px,-10px) rotate(11deg);filter:brightness(1.8)}
  100%{transform:scale(1.5) translate(0,0) rotate(0);filter:brightness(2.4)}}
#s-question.quake{animation:quake .55s ease}
@keyframes quake{0%,100%{transform:translate(0,0)}15%{transform:translate(-12px,6px)}30%{transform:translate(10px,-8px)}45%{transform:translate(-8px,5px)}60%{transform:translate(6px,-4px)}80%{transform:translate(-3px,2px)}}
#s-question.yes .q-pre,#s-question.yes .q-title{transition:all 1s;text-shadow:0 0 70px rgba(255,93,143,.95),0 0 20px rgba(255,255,255,.6)}
.no-wrap.fade-out{opacity:0;transition:opacity .5s}

/* ---------- TELA 6/7/8: declaração + presente ---------- */
#s-decl{display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;justify-content:flex-start;align-items:stretch;
  padding:0;scrollbar-width:thin;scrollbar-color:#ff7aa2 transparent;overscroll-behavior:contain}
#s-decl.active{display:block}
#s-decl::-webkit-scrollbar{width:6px}#s-decl::-webkit-scrollbar-thumb{background:#ff7aa2;border-radius:6px}
.decl-flow{max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:calc(16vh + env(safe-area-inset-top)) clamp(22px,6vw,48px) 10vh}
.txt{font-size:clamp(1.05rem,2.5vw,1.28rem);line-height:1.9;font-weight:300;color:#fbe9ee;max-width:34rem;margin:0 auto 1.9rem;text-align:left}
.txt strong{font-weight:600;color:#ffc4d4}
.txt.saudacao{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(3rem,11vw,5.4rem);line-height:1.1;text-align:center;max-width:none;margin-bottom:1rem;
  color:var(--cream);text-shadow:0 0 50px rgba(255,93,143,.6)}
.txt.destaque{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.4rem,4.4vw,2.1rem);line-height:1.5;text-align:center;color:#ffd0dd;margin:2.4rem auto;text-shadow:0 0 30px rgba(255,93,143,.35)}
.txt.final{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(2rem,7.5vw,3.6rem);line-height:1.25;text-align:center;max-width:none;margin:3rem auto 1rem;color:var(--cream);
  text-shadow:0 0 50px rgba(255,93,143,.75)}
.reveal{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1),filter 1s ease}
.reveal.in{opacity:1;transform:none;filter:none}
.scroll-hint{align-self:center;width:18px;height:18px;border-right:3px solid rgba(255,190,210,.8);border-bottom:3px solid rgba(255,190,210,.8);
  transform:rotate(45deg);margin:2.4rem auto 5rem;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0;opacity:.35}50%{translate:0 10px;opacity:1}}

.photo{position:relative;width:min(80%,390px);margin:3rem 0;--rot:-3deg;transform:translateY(46px) scale(.93) rotate(var(--rot))}
.photo.in{transform:rotate(var(--rot))}
.photo.left{align-self:flex-start;margin-left:clamp(-8vw,-2vw,0px)}
.photo.right{align-self:flex-end;margin-right:clamp(-8vw,-2vw,0px);--rot:2.6deg}
.photo:nth-of-type(3n){--rot:-1.8deg}
.photo-frame{position:relative;padding:12px 12px 46px;background:linear-gradient(160deg,#fffaf5,#f5e6dc);border-radius:3px;
  box-shadow:0 34px 60px -22px rgba(0,0,0,.75),0 8px 22px rgba(0,0,0,.4),0 0 60px rgba(255,120,160,.18)}
.photo-frame::before{content:"";position:absolute;top:-14px;left:50%;width:96px;height:26px;margin-left:-48px;transform:rotate(-4deg);
  background:rgba(255,232,196,.6);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.photo-frame::after{content:"";position:absolute;inset:12px 12px 46px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 40%,rgba(0,0,0,.14))}
.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#3a2230}
.photo .ph{display:none;aspect-ratio:4/5;align-items:center;justify-content:center;flex-direction:column;gap:.6rem;background:linear-gradient(160deg,#4a1a3a,#2a0e26);color:#ffb3c8;font-size:.7rem}
.photo .ph-heart{font-size:2.6rem}
.photo.missing img{display:none}.photo.missing .ph{display:flex}

.gift-section{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16vh 0 18vh;margin-top:14vh}
.gift-title{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(1.8rem,6.4vw,3.2rem);line-height:1.2;max-width:16ch;margin-bottom:2.4rem;color:var(--cream);text-shadow:0 0 40px rgba(255,180,120,.5)}
.gift-stage{position:relative;width:min(440px,92vw);height:clamp(320px,84vw,380px)}
.gift{position:absolute;left:50%;top:50%;width:18em;height:19em;margin:-9.5em 0 0 -9em;font-size:clamp(11px,3.6vw,16px);cursor:pointer;outline:none;
  transform-origin:50% 90%;-webkit-user-select:none;user-select:none}
.gift.idle{animation:giftWiggle 4.4s ease-in-out infinite}
.gift:focus-visible .gift-body{outline:3px solid #fff;outline-offset:6px}
@keyframes giftWiggle{0%,62%,100%{transform:rotate(0)}66%{transform:rotate(-4deg)}70%{transform:rotate(4deg)}74%{transform:rotate(-3deg)}78%{transform:rotate(2deg)}82%{transform:rotate(0)}}
.gift-glow{position:absolute;left:50%;bottom:1em;width:24em;height:20em;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,200,140,.4),transparent 65%);animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}
.gift-shadow{position:absolute;left:50%;bottom:.3em;width:16em;height:2em;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(3px)}
.gift-box{position:absolute;inset:0;transition:transform .2s ease,opacity 1.3s ease}
.gift.press .gift-box{transform:scale(.94,1.05)}
.gift.shake .gift-box{animation:giftShake .65s ease}
@keyframes giftShake{0%,100%{transform:translate(0,0) rotate(0)}12%{transform:translate(-6px,0) rotate(-4deg)}25%{transform:translate(6px,0) rotate(4deg)}38%{transform:translate(-6px,0) rotate(-4deg)}
  50%{transform:translate(6px,0) rotate(3deg)}62%{transform:translate(-4px,0) rotate(-2deg)}75%{transform:translate(4px,-6px) rotate(2deg)}88%{transform:translate(0,2px) rotate(0)}}
.gift-body{position:absolute;left:50%;bottom:1.3em;width:14em;height:9.8em;transform:translateX(-50%);border-radius:.4em .4em .9em .9em;
  background:linear-gradient(90deg,#9c1a40 0%,#e23b6c 20%,#f0507d 50%,#e23b6c 80%,#8f1638 100%);
  box-shadow:inset 0 -1.3em 1.8em rgba(0,0,0,.28),0 1em 2em rgba(0,0,0,.4)}
.gift-body::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2.7em;transform:translateX(-50%);
  background:linear-gradient(90deg,#b98432,#f3c46f 35%,#ffe7a8 50%,#f3c46f 65%,#b98432)}
.gift-body::after{content:"";position:absolute;left:0;right:0;top:0;height:3em;border-radius:.4em .4em 0 0;background:linear-gradient(rgba(0,0,0,.4),transparent)}
.gift-lid{position:absolute;left:50%;bottom:11em;width:15.4em;height:3.6em;margin-left:-7.7em;border-radius:.5em;transform-origin:15% 100%;
  background:linear-gradient(90deg,#a91d47,#ee4a79 25%,#ff6a95 50%,#ee4a79 75%,#9c1a40);
  box-shadow:0 .5em 1em rgba(0,0,0,.35),inset 0 .25em .3em rgba(255,255,255,.3);
  transition:transform .95s cubic-bezier(.3,1.25,.5,1)}
.gift-lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2.9em;transform:translateX(-50%);
  background:linear-gradient(90deg,#b98432,#f3c46f 35%,#ffe7a8 50%,#f3c46f 65%,#b98432)}
.gift-lid::after{content:"";position:absolute;left:.4em;right:.4em;top:-1em;height:1em;background:linear-gradient(#ff9bb8,#ff6a95);
  clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.bow{position:absolute;left:50%;bottom:100%;width:0;height:0;margin-bottom:.1em}
.bow .loop{position:absolute;bottom:0;width:4.6em;height:3.3em;border-radius:50%;
  background:radial-gradient(ellipse at 50% 60%,#e8a94a 0%,#ffe19a 55%,#ffcf6b 100%);
  box-shadow:inset 0 0 0 .22em rgba(160,100,20,.35),0 .3em .6em rgba(0,0,0,.3);transition:transform .5s ease}
.bow .loop::after{content:"";position:absolute;inset:.75em 1.1em;border-radius:50%;background:radial-gradient(ellipse,#a9701f,#d6963a);opacity:.85}
.bow .loop.l{right:.1em;transform:rotate(-26deg);transform-origin:100% 100%}
.bow .loop.r{left:.1em;transform:rotate(26deg);transform-origin:0 100%}
.bow .knot{position:absolute;left:-1.25em;bottom:-.35em;width:2.5em;height:2.3em;border-radius:.7em;background:linear-gradient(#ffe8b0,#e0a850);
  box-shadow:0 .2em .4em rgba(0,0,0,.35),inset 0 .2em .2em rgba(255,255,255,.5)}
.gift.shake .bow .loop.l{animation:loopFlutL .3s ease-in-out infinite alternate}
.gift.shake .bow .loop.r{animation:loopFlutR .3s ease-in-out infinite alternate}
@keyframes loopFlutL{to{transform:rotate(-44deg)}}@keyframes loopFlutR{to{transform:rotate(44deg)}}
.gift.open .gift-lid{transform:translate(-5.2em,-5.4em) rotate(-24deg)}
.gift-light{position:absolute;left:50%;bottom:11em;width:12em;height:17em;margin-left:-6em;transform:scaleY(.15);transform-origin:50% 100%;opacity:0;pointer-events:none;filter:blur(.5em);
  background:linear-gradient(to top,rgba(255,236,190,.95),rgba(255,180,200,.4) 55%,transparent);clip-path:polygon(14% 100%,86% 100%,100% 0,0 0);
  transition:transform 1s ease,opacity 1s ease}
.gift.open .gift-light{transform:scaleY(1);opacity:1}
.gift.done .gift-box{opacity:0;transform:translateY(2em) scale(.88);pointer-events:none}
.gift.done{pointer-events:none;animation:none}
.gift.done .gift-glow{opacity:0;transition:opacity 1s}
.gift-hint{margin-top:1.8rem;font-size:.95rem;letter-spacing:.14em;color:#ffdbe6;animation:hintPulse 2s ease-in-out infinite;transition:opacity .6s}
.gift-hint.gone{opacity:0;animation:none}
@keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:1}}
.song{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;opacity:0;pointer-events:none;
  transform:translateY(3.4em) scale(.65);filter:blur(10px);transition:opacity 1.3s ease,transform 1.3s cubic-bezier(.2,.9,.3,1.1),filter 1.3s ease}
.gift-stage.revealed .song{opacity:1;transform:none;filter:none;pointer-events:auto}
.song-title{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(3.4rem,15vw,5.8rem);line-height:1;
  background:linear-gradient(120deg,#fff1ea,#ffb3c7 55%,#ff7aa2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 30px rgba(255,93,143,.55))}
.song-artist{font-size:clamp(.95rem,3.6vw,1.25rem);letter-spacing:.32em;font-weight:500;color:#ffdbe6;text-transform:uppercase}
.song-heart{font-size:2rem;margin:.6rem 0 1.2rem}
.song .btn{background:linear-gradient(135deg,#ffb36b,#ff5d8f)}

/* ---------- JOGOS 02 e 03 + MENSAGEM ---------- */
.gscreen{background:radial-gradient(ellipse at 50% 30%,#2a1030,#0d0510 80%);gap:12px;padding:12px}
#s-cards{--ch:min(52vh,520px)}
.gbar{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;justify-content:center;font-family:var(--pixel);font-size:clamp(.5rem,1.3vh,.72rem);line-height:1.8;color:#ffe9b0;text-shadow:2px 2px 0 #000;text-align:center}
.gbar b{color:#ff7aa2;font-weight:400}
.gbox{position:relative;border:4px solid #ffb05a;box-shadow:0 0 0 3px #1a0503,8px 8px 0 #000;background:#000;line-height:0}
.gbox canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#cgCv{height:var(--ch);width:calc(var(--ch)*400/520);cursor:pointer}
#mnCv{width:min(94vw,820px,calc(56vh*720/430));aspect-ratio:720/430;height:auto;cursor:crosshair;image-rendering:pixelated}
.gov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;line-height:1.6;background:rgba(10,3,14,.84);transition:opacity .5s}
.gov.hide{opacity:0;pointer-events:none}
.gov h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,5.2vh,3.6rem);line-height:1;letter-spacing:.04em;color:#ffd6e0;text-shadow:0 0 24px rgba(255,93,143,.6),4px 4px 0 #000}
.gov p{font-family:var(--pixel);font-size:clamp(.5rem,1.3vh,.74rem);line-height:2;color:#ffe9b0;max-width:32rem;text-shadow:2px 2px 0 #000}
.hand{display:flex;gap:12px;padding-top:8px}
.card{position:relative;width:clamp(66px,calc(var(--ch)*.19),92px);height:clamp(80px,calc(var(--ch)*.24),112px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(#ffe7ae,#e9a93a);border:3px solid #7a4a10;box-shadow:0 0 0 2px #1a0503,4px 4px 0 #000;transition:transform .12s,filter .2s,box-shadow .2s}
.card .em{font-size:clamp(1.6rem,4.4vh,2.4rem);line-height:1}
.card .nm{font:400 .42rem/1.5 var(--pixel);color:#3a1d00;text-align:center}
.card .co{position:absolute;left:-9px;top:-11px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9ed1,#b0128a);border:2px solid #fff;font:400 .6rem/22px var(--pixel);color:#fff;text-align:center}
kbd{position:absolute;right:3px;bottom:1px;font:400 .5rem var(--pixel);color:#fff;text-shadow:1px 1px 0 #000}
.card kbd{color:#5a3200;text-shadow:none}
@media (hover:hover){.card:hover{transform:translateY(-5px)}}
.card.sel{transform:translateY(-12px) scale(1.06);box-shadow:0 0 0 2px #fff,0 0 22px #ffd23f,4px 4px 0 #000}
.card.off{filter:grayscale(.85) brightness(.62)}
.elx{position:relative;width:calc(var(--ch)*400/520 + 8px);height:20px;background:#1a0a1e;border:3px solid #ffb05a;box-shadow:4px 4px 0 #000}
.elx i{position:absolute;inset:0 auto 0 0;width:50%;background:linear-gradient(#ff9ed1,#c2188a);transition:width .1s linear}
.elx b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 .6rem var(--pixel);color:#fff;text-shadow:1px 1px 0 #000}
.hotbar{display:flex;gap:4px;padding:6px;background:#2b2b2b;border:3px solid #111;box-shadow:inset 0 0 0 3px #555,6px 6px 0 #000}
.slot{position:relative;width:clamp(44px,6.4vh,58px);aspect-ratio:1;background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;padding:0}
.slot i{position:absolute;inset:5px;background-size:100% 100%;image-rendering:pixelated}
.slot.sel{outline:4px solid #fff;outline-offset:1px;z-index:1}
#s-msg{gap:1rem}
.msg{display:flex;flex-direction:column;align-items:center;gap:1.1rem;margin-bottom:1.6rem}
.msg-l{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.15rem,2.6vw,1.7rem);line-height:1.6;color:#ffdbe6;max-width:min(92vw,34rem)}
.msg-h{font-weight:700;font-size:clamp(3rem,9vw,5.2rem);line-height:1.1;color:var(--cream);text-shadow:0 0 50px rgba(255,93,143,.6)}
.msg-f{font-weight:700;color:var(--cream);font-size:clamp(1.3rem,3vw,2rem);text-shadow:0 0 30px rgba(255,93,143,.5)}

/* ---------- responsividade ---------- */
@media (max-width:640px){
  .btn{min-width:150px;padding:16px 28px;font-size:.85rem}
  .photo{width:min(82%,340px)}
  .photo.left,.photo.right{align-self:center;margin-left:0;margin-right:0}
  .photo.left{--rot:-2.4deg}.photo.right{--rot:2.2deg}
  .decl-flow{padding-top:calc(12vh + env(safe-area-inset-top))}
  .txt{text-align:left}
  .answers{gap:1rem}
}
@media (max-height:520px) and (orientation:landscape){
  .screen{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:14px}
  .hello{margin-bottom:.6rem;font-size:clamp(2rem,9vh,3.6rem)}
  .love{margin:.4rem 0 1rem}
  .c-title{font-size:clamp(2.6rem,20vh,5rem);margin-bottom:.6rem}
  .c-text{margin-bottom:1.2rem}
  .win-title{font-size:clamp(3rem,26vh,6rem);margin-bottom:1.4rem}
  .q-title{font-size:clamp(1.8rem,10vh,3rem)}
  #s-question{gap:.4rem}
}
@media (prefers-reduced-motion:reduce){
  .btn::after,.aurora,.gift.idle,.emo,.gift-glow,.grain,.scroll-hint,.gift-hint{animation:none!important}
}
</style>
</head>

<body>
<div id="stage" data-mode="romantic">
  <div class="aurora" aria-hidden="true"></div>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="gift-spot" id="giftSpot" aria-hidden="true"></div>

  <!-- TELA 1 — introdução -->
  <section id="s-intro" class="screen">
    <h1 class="hello rise" style="--d:.3s" id="introTitle"></h1>
    <p class="lead rise" style="--d:1.3s" id="introL1"></p>
    <p class="lead rise" style="--d:2.2s" id="introL2"></p>
    <p class="love rise" style="--d:3.1s" id="introL3"></p>
    <button class="btn rise" style="--d:3.9s" id="btnStart" disabled></button>
  </section>

  <!-- TELA 2 — desafio -->
  <section id="s-challenge" class="screen">
    <div class="c-layer c-static"></div>
    <div class="c-layer c-scan"></div>
    <div class="c-layer c-vig"></div>
    <div class="rise" style="--d:.2s"><h1 class="c-title" id="chTitle"></h1></div>
    <p class="c-text rise" style="--d:1.2s" id="chText"></p>
    <button class="btn btn-retro rise" style="--d:2.1s" id="btnChallenge" disabled></button>
  </section>

  <!-- TELA 3 — mini FPS -->
  <section id="s-fps" class="screen">
    <div class="fps-wrap" id="fpsWrap">
      <canvas id="game"></canvas>
      <div class="fps-fx fps-vig"></div>
      <div class="fps-fx scan"></div>
      <div class="fps-fx fps-muzzle" id="muzzleLight"></div>
      <div class="fps-fx fps-hurt" id="hurt"></div>
      <div class="fps-fx fps-gold" id="goldFx"></div>
      <canvas id="gun" width="128" height="128"></canvas>
      <div id="crosshair"></div>
      <div class="hud" id="hud"></div>
      <div class="fps-hint" id="fpsHint"></div>
      <div class="letterbox top"></div><div class="letterbox bot"></div>
      <button class="fire-btn" id="fireBtn" type="button" aria-label="Atirar">ATIRAR</button>
    </div>
  </section>

  <!-- TELA 4 — GAME WIN -->
  <section id="s-win" class="screen">
    <div class="stars" id="stars"></div>
    <div class="grain"></div><div class="scan"></div>
    <h1 class="win-title" id="winTitle"></h1>
    <button class="btn btn-retro btn-gold" id="btnWin"></button>
  </section>

  <!-- JOGO 02 — cartinhas de amor (estilo Clash Royale) -->
  <section id="s-cards" class="screen gscreen">
    <div class="gbar"><span id="cgHint"></span></div>
    <div class="gbox"><canvas id="cgCv"></canvas>
      <div class="gov" id="cgOv"><h2></h2><p></p><button class="btn btn-retro btn-gold"></button></div></div>
    <div class="hand" id="hand"></div>
    <div class="elx"><i id="elxF"></i><b id="elxN">5</b></div>
  </section>

  <!-- JOGO 03 — construir o coração (estilo Minecraft) -->
  <section id="s-mine" class="screen gscreen">
    <div class="gbar"><span id="mnHint"></span><span>BLOCOS: <b id="mnCount">0</b>/<b id="mnTot">0</b></span><span id="mnBlk"></span></div>
    <div class="gbox"><canvas id="mnCv"></canvas>
      <div class="gov" id="mnOv"><h2></h2><p></p><button class="btn btn-retro btn-gold"></button></div></div>
    <div class="hotbar" id="hotbar"></div>
  </section>

  <!-- MENSAGEM antes da pergunta -->
  <section id="s-msg" class="screen">
    <div class="msg" id="msgBox"></div>
    <button class="btn rise" id="btnMsg" disabled></button>
  </section>

  <!-- TELA 5 — pergunta -->
  <section id="s-question" class="screen">
    <p class="q-pre" id="qPre" data-avoid></p>
    <h2 class="q-title" id="qTitle" data-avoid></h2>
    <div class="answers" id="answers">
      <button class="btn btn-yes" id="btnYes" data-avoid></button>
      <div class="no-slot" id="noSlot">
        <div class="no-wrap" id="noWrap" data-level="0">
          <div class="no-tilt" id="noTilt">
            <button class="btn btn-no" id="btnNo"></button>
            <span class="sweat" aria-hidden="true">💧</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- TELAS 6, 7 e 8 — declaração, presente e música (uma página vertical contínua) -->
  <section id="s-decl" class="screen">
    <div class="decl-flow" id="declFlow"></div>
    <div class="decl-flow" style="padding-top:0;padding-bottom:0">
      <div class="gift-section" id="giftSection">
        <h2 class="gift-title reveal" id="giftTitle"></h2>
        <div class="gift-stage" id="giftStage">
          <div class="gift idle" id="gift" role="button" tabindex="0" aria-label="Abrir o presente">
            <div class="gift-glow"></div>

/* =====================================================================
   ÁUDIO (Web Audio, sem arquivos). Se o navegador bloquear, segue sem som.

const Snd = {
    ctx: null, ok: true, master: null,
    init() {
        if (!this.ok) return;
        try {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) { this.ok = false; return; }
                this.ctx = new AC();
                this.master = this.ctx.createGain();
                this.master.gain.value = .55;
                this.master.connect(this.ctx.destination);
            }
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        } catch (e) { this.ok = false; }
    },
    tone(f0, f1, dur, type = 'square', vol = .2, delay = 0) {
        if (!this.ok || !this.ctx) return;
        try {
            const c = this.ctx, t = c.currentTime + delay;
            const o = c.createOscillator(), g = c.createGain();
            o.type = type; o.frequency.setValueAtTime(f0, t);
            if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
            o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .02);
        } catch (e) {}
    },
    noise(dur, vol, f0, f1, delay = 0) {
        if (!this.ok || !this.ctx) return;
        try {
            const c = this.ctx, t = c.currentTime + delay, n = Math.max(1, (c.sampleRate * dur) | 0);
            const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
            for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
            const s = c.createBufferSource(); s.buffer = b;
            const f = c.createBiquadFilter(); f.type = 'lowpass';
            f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
            const g = c.createGain(); g.gain.value = vol;
            s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
        } catch (e) {}
    },
    shoot() { this.noise(.16, .5, 5200, 400); this.tone(180, 45, .14, 'sawtooth', .3); },
    hit() { this.tone(520, 180, .08, 'square', .12); this.noise(.05, .2, 3000, 800); },
    die() { this.tone(300, 40, .5, 'sawtooth', .22); this.noise(.4, .25, 1800, 120); },
    thud() { this.tone(90, 40, .18, 'sine', .35); },
    win() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, f, .28, 'square', .14, i * .11)); },
    blip() { this.tone(660, 880, .08, 'triangle', .12); },
    pop() { this.tone(400, 900, .12, 'sine', .2); },
    chime() { [880, 1175, 1568].forEach((f, i) => this.tone(f, f, .5, 'sine', .1, i * .09)); },

/* =====================================================================
   CORAÇÕES + FUNDO ROMÂNTICO
   ===================================================================== */
function makeHeart(c1, c2) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); if (!g) return c;
    g.translate(32, 34);
    g.beginPath(); g.moveTo(0, 22);
    g.bezierCurveTo(-34, -2, -22, -28, 0, -12);
    g.bezierCurveTo(22, -28, 34, -2, 0, 22); g.closePath();
    const gr = g.createLinearGradient(-20, -20, 20, 22); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fill();
    return c;
}
const HEART = { rose: makeHeart('#ff8fb1', '#ff3d77'), pink: makeHeart('#ffd0dc', '#ff8fb1'), gold: makeHeart('#fff0c2', '#ffbf69'), red: makeHeart('#ff6b6b', '#c1121f') };
const HEART_KEYS = ['rose', 'pink', 'gold', 'rose'];

const Bg = {
    cv: $('#bg'), ctx: null, parts: [], on: false, raf: 0, last: 0, w: 0, h: 0, dpr: 1, t: 0,
    init() {
        this.ctx = this.cv.getContext('2d');
        this.resize();
        addEventListener('resize', () => this.resize());
        this.loop = ts => {
            if (!this.on) return;
            this.raf = requestAnimationFrame(this.loop);
            const dt = Math.min(.05, (ts - this.last) / 1000 || .016); this.last = ts; this.t += dt;
            this.draw(dt);
        };
    },
    resize() {
        this.dpr = Math.min(2, window.devicePixelRatio || 1);
        this.w = innerWidth; this.h = innerHeight;
        this.cv.width = this.w * this.dpr; this.cv.height = this.h * this.dpr;
        if (this.ctx) this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        const n = reduceMotion ? 8 : Math.round(clamp(this.w / 38, 14, 34));
        while (this.parts.length < n) this.parts.push(this.make(true));
        this.parts.length = n;
    },
    make(init) {
        const heart = Math.random() < .7;
        return { x: rand(0, this.w), y: init ? rand(0, this.h) : this.h + rand(20, 120), s: heart ? rand(9, 26) : rand(2, 5),
            vy: rand(12, 38), ph: rand(0, 6.28), sw: rand(8, 26), a: rand(.12, .42), heart, c: HEART_KEYS[(Math.random() * 4) | 0] };
    },
    draw(dt) {
        const g = this.ctx; if (!g) return;
        g.clearRect(0, 0, this.w, this.h);
        for (let i = 0; i < this.parts.length; i++) {
            const p = this.parts[i];
            p.y -= p.vy * dt; p.ph += dt;
            const x = p.x + Math.sin(p.ph) * p.sw;
            if (p.y < -40) this.parts[i] = this.make(false);
            const fade = clamp(Math.min(p.y / 120, (this.h - p.y) / 60 + .4), 0, 1);
            g.globalAlpha = p.a * fade;
            if (p.heart) g.drawImage(HEART[p.c], x - p.s / 2, p.y - p.s / 2, p.s, p.s);
            else { g.fillStyle = '#ffe3c2'; g.beginPath(); g.arc(x, p.y, p.s * (.6 + .4 * Math.sin(p.ph * 3)), 0, 6.283); g.fill(); }
        }
        g.globalAlpha = 1;
    },
    start() { if (this.on) return; this.on = true; this.last = performance.now(); this.raf = requestAnimationFrame(this.loop); },
    stop() { this.on = false; cancelAnimationFrame(this.raf); if (this.ctx) this.ctx.clearRect(0, 0, this.w, this.h); }
};

/* =====================================================================
   EFEITOS (corações, faíscas, estilhaços, explosão) — canvas por cima de tudo
   ===================================================================== */
const Burst = {
    cv: $('#top'), ctx: null, parts: [], raf: 0, w: 0, h: 0, dpr: 1, last: 0,
    init() { this.ctx = this.cv.getContext('2d'); this.resize(); addEventListener('resize', () => this.resize()); this.tick = this.tick.bind(this); },
    resize() {
        this.dpr = Math.min(2, window.devicePixelRatio || 1); this.w = innerWidth; this.h = innerHeight;
        this.cv.width = this.w * this.dpr; this.cv.height = this.h * this.dpr;
        if (this.ctx) this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    },
    add(p) {
        if (this.parts.length > 420) this.parts.shift();
        p.max = p.life; p.rot = p.rot || 0; p.vr = p.vr || 0; p.g = p.g || 0; p.drag = p.drag || 1; this.parts.push(p);
        if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(this.tick); }
    },
    hearts(x, y, n, spread = 1) {
        for (let i = 0; i < n; i++) this.add({ type: 'heart', x, y, vx: rand(-260, 260) * spread, vy: rand(-540, -120) * spread, g: 520, life: rand(1.2, 2.2),
            size: rand(14, 34), c: HEART_KEYS[(Math.random() * 4) | 0], rot: rand(-.5, .5), vr: rand(-2, 2), drag: .985 });
    },
    risingHearts(x, y, n) {
        for (let i = 0; i < n; i++) this.add({ type: 'heart', x: x + rand(-60, 60), y, vx: rand(-40, 40), vy: rand(-220, -90), g: -10, life: rand(1.8, 3),
            size: rand(12, 30), c: HEART_KEYS[(Math.random() * 4) | 0], rot: rand(-.4, .4), vr: rand(-1, 1), drag: .995 });
    },
    sparkle(x, y, n, colors = ['#fff6c0', '#ffd23f', '#ff9dbb', '#ffffff']) {
        for (let i = 0; i < n; i++) { const a = rand(0, 6.283), s = rand(80, 420);
            this.add({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, g: 260, life: rand(.7, 1.5), size: rand(2, 5), color: colors[(Math.random() * colors.length) | 0], drag: .96 }); }
    },
    pixels(x, y, n, colors) {
        for (let i = 0; i < n; i++) { const a = rand(0, 6.283), s = rand(100, 520);
            this.add({ type: 'shard', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 160, g: 700, life: rand(.8, 1.6), size: rand(5, 10), color: colors[(Math.random() * colors.length) | 0], vr: rand(-6, 6), drag: .98 }); }
    },
    explode(cx, cy, bw, bh) {
        const shardCols = ['#8b7bb0', '#57466f', '#b9a9d6', '#ff9a3d', '#ffffff'];
        for (let i = 0; i < 30; i++) { const a = rand(0, 6.283), s = rand(220, 760);
            this.add({ type: 'shard', x: cx + rand(-bw / 2, bw / 2) * .8, y: cy + rand(-bh / 2, bh / 2) * .8, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, g: 900, life: rand(1, 1.8),
                size: rand(7, 18), color: shardCols[(Math.random() * shardCols.length) | 0], vr: rand(-9, 9), drag: .985 }); }
        const fire = ['#fff6b0', '#ffd23f', '#ff8a1f', '#ff4d1f', '#ffffff'];
        for (let i = 0; i < 80; i++) { const a = rand(0, 6.283), s = rand(160, 980);
            this.add({ type: 'spark', x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 340, life: rand(.5, 1.3), size: rand(2, 6), color: fire[(Math.random() * fire.length) | 0], drag: .93 }); }
        for (let i = 0; i < 14; i++) this.add({ type: 'smoke', x: cx + rand(-20, 20), y: cy + rand(-20, 20), vx: rand(-90, 90), vy: rand(-140, -20), g: -30, life: rand(.9, 1.6), size: rand(20, 44), drag: .96 });
        this.add({ type: 'ring', x: cx, y: cy, life: .6, size: 30, grow: 620, lw: 8, color: '255,220,140' });
        this.add({ type: 'ring', x: cx, y: cy, life: .8, size: 10, grow: 420, lw: 4, color: '255,120,60' });
        this.hearts(cx, cy, 10, .8);
    },
    tick(ts) {
        const g = this.ctx, dt = Math.min(.05, (ts - this.last) / 1000 || .016); this.last = ts;
        g.clearRect(0, 0, this.w, this.h);
        for (let i = this.parts.length - 1; i >= 0; i--) {
            const p = this.parts[i]; p.life -= dt;
            if (p.life <= 0) { this.parts.splice(i, 1); continue; }
            const k = p.life / p.max;
            if (p.type === 'ring') {
                p.size += p.grow * dt; g.strokeStyle = 'rgba(' + p.color + ',' + (k * .9).toFixed(3) + ')'; g.lineWidth = p.lw * k + 1;
                g.beginPath(); g.arc(p.x, p.y, p.size, 0, 6.283); g.stroke(); continue;
            }
            p.vx *= Math.pow(p.drag, dt * 60); p.vy = p.vy * Math.pow(p.drag, dt * 60) + p.g * dt;
            p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
            if (p.type === 'heart') {
                g.globalAlpha = clamp(k * 1.6, 0, 1); g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
                g.drawImage(HEART[p.c], -p.size / 2, -p.size / 2, p.size, p.size); g.restore();
            } else if (p.type === 'spark') {
                g.globalAlpha = clamp(k * 1.4, 0, 1); g.globalCompositeOperation = 'lighter'; g.fillStyle = p.color;
                g.beginPath(); g.arc(p.x, p.y, p.size * (.4 + k * .6), 0, 6.283); g.fill(); g.globalCompositeOperation = 'source-over';
            } else if (p.type === 'shard') {
                g.globalAlpha = clamp(k * 1.5, 0, 1); g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.color;
                g.beginPath(); g.moveTo(-p.size / 2, -p.size / 3); g.lineTo(p.size / 2, -p.size / 2.4); g.lineTo(p.size / 3, p.size / 2); g.closePath(); g.fill(); g.restore();
            } else if (p.type === 'smoke') {
                g.globalAlpha = k * .35; g.fillStyle = '#3a2a3a'; g.beginPath(); g.arc(p.x, p.y, p.size * (1.6 - k * .6), 0, 6.283); g.fill();
            }
        }
        g.globalAlpha = 1;
        if (this.parts.length) this.raf = requestAnimationFrame(this.tick);
        else { this.raf = 0; g.clearRect(0, 0, this.w, this.h); }
    }
};

const SCREENS = {};
const Nav = { cur: null, busy: false };

function reg(name, sel, mode, onEnter, onLeave) { SCREENS[name] = { name, el: $(sel), mode, onEnter, onLeave }; }
function setMode(m) { stage.dataset.mode = m; if (m === 'romantic') Bg.start(); else Bg.stop(); }
function go(name, kind = 'soft') {

/* ---- renderização ---- */

function drawTorch(it, horizon) {

/* ---- laço principal ---- */
function fpsUpdate(dt) {
    G.t += dt;
    if (G.keyDir && !G.ended) G.yawT = clamp(G.yawT + G.keyDir * dt * 1.7, -G.maxYaw, G.maxYaw);
    const k = 1 - Math.exp(-dt * (G.touchAim ? 22 : 16));

    for (let i = G.parts.length - 1; i >= 0; i--) {
        const p = G.parts[i]; p.life -= dt; if (p.life <= 0) { G.parts.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; if (p.g) p.vy += p.g * dt;

    Q.timers.push(setTimeout(() => { title.classList.add('show'); pre.classList.add('dim'); Snd.chime(); }, 3300));
    Q.timers.push(setTimeout(() => {
        ans.classList.add('show'); noSlot.style.width = noSlot.offsetWidth + 'px'; noSlot.style.height = noSlot.offsetHeight + 'px';
    }, 4400));
    Q.timers.push(setTimeout(() => { Q.armed = true; }, 5000));
}
const rectOf = el => el.getBoundingClientRect();
function pickSpot(pxp, pyp) {
    const vw = innerWidth, vh = innerHeight, bw = btnNo.offsetWidth + 10, bh = btnNo.offsetHeight + 10, m = 26;
    const minX = m, maxX = Math.max(minX, vw - bw - m), minY = m + 6, maxY = Math.max(minY, vh - bh - m);
    const avoid = $$('[data-avoid]').map(el => { const r = rectOf(el); return { l: r.left - 18, t: r.top - 18, r: r.right + 18, b: r.bottom + 18 }; }).filter(r => r.r > r.l);
    const ok = [];
    for (let i = 0; i < 70; i++) {
        const x = rand(minX, maxX), y = rand(minY, maxY);
        let bad = false;
        for (const a of avoid) if (x < a.r && x + bw > a.l && y < a.b && y + bh > a.t) { bad = true; break; }
        if (bad) continue;
        const dp = Math.hypot(x + bw / 2 - pxp, y + bh / 2 - pyp), dc = Math.hypot(x - Q.x, y - Q.y);
        if (Q.free && dc < 140) continue;
        ok.push({ x, y, s: dp + rand(0, 90) });
    }
    if (!ok.length) { // plano B: cantos, ainda evitando textos e SIM
        [[minX, minY], [maxX, minY], [minX, maxY], [maxX, maxY]].forEach(c => {
            let bad = false; for (const a of avoid) if (c[0] < a.r && c[0] + bw > a.l && c[1] < a.b && c[1] + bh > a.t) { bad = true; break; }
            if (!bad) ok.push({ x: c[0], y: c[1], s: Math.hypot(c[0] - pxp, c[1] - pyp) });
        });
    }
    if (!ok.length) return { x: clamp(Q.x + 200, minX, maxX), y: clamp(Q.y, minY, maxY) };
    ok.sort((a, b) => b.s - a.s);
    return ok[(Math.random() * Math.min(4, ok.length)) | 0];
}
function placeNo(x, y, dur) {
    Q.x = x; Q.y = y;
    noWrap.style.transition = dur > 0 ? 'transform ' + dur + 's cubic-bezier(.22,1,.36,1)' : 'none';
    noWrap.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
}
function freeNo() {
    if (Q.free) return;
    const r = rectOf(btnNo);
    noSlot.style.width = r.width + 'px'; noSlot.style.height = r.height + 'px';
    noWrap.classList.add('free'); placeNo(r.left, r.top, 0); void noWrap.offsetWidth; Q.free = true;
}
function levelFor(n) { return n >= 7 ? 3 : n >= 5 ? 2 : n >= 3 ? 1 : 0; }
function flee(pxp, pyp) {
    if (!Q.armed || Q.exploding || Q.answered) return;
    const now = performance.now();
    if (now < Q.nextFlee) return;
    Q.attempts++;
    Q.nextFlee = now + Math.max(150, 340 - Q.attempts * 22);
    if (Q.attempts >= CONFIG.jogo.tentativasNao) { doom(); return; }
    freeNo();
    const lv = levelFor(Q.attempts); noWrap.dataset.level = lv;
    const dur = Math.max(.14, .34 - Q.attempts * .022);
    const spot = pickSpot(pxp, pyp); placeNo(spot.x, spot.y, dur);
    noTilt.style.transform = lv >= 2 ? 'rotate(' + ((Math.random() < .5 ? -1 : 1) * rand(6, 16)).toFixed(1) + 'deg)' : 'none';
    btnNo.classList.remove('dash'); void btnNo.offsetWidth; btnNo.classList.add('dash');
    Snd.tone(500 + Q.attempts * 60, 900 + Q.attempts * 80, .07, 'triangle', .1);
}
function nearNo(x, y, th) {
    const r = rectOf(btnNo), dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
    return Math.hypot(dx, dy) < th;
}
/* computador: detecta a aproximação do ponteiro e foge ANTES do clique */
document.addEventListener('pointermove', e => {
    Q.px = e.clientX; Q.py = e.clientY;
    if (!Q.armed || Q.exploding || Q.answered || e.pointerType !== 'mouse') return;
    if (nearNo(e.clientX, e.clientY, 115 + Q.attempts * 7)) flee(e.clientX, e.clientY);
});
/* celular (e clique rápido no computador): reage no pointerdown/touchstart, antes de o toque terminar */
document.addEventListener('pointerdown', e => {
    if (!Q.armed || Q.exploding || Q.answered) return;
    const onBtn = e.target === btnNo || (btnNo.contains && btnNo.contains(e.target));
    if (onBtn || nearNo(e.clientX, e.clientY, e.pointerType === 'mouse' ? 115 : 44)) { if (onBtn) e.preventDefault(); flee(e.clientX, e.clientY); }
}, true);
document.addEventListener('touchstart', e => {
    if (!Q.armed || Q.exploding || Q.answered || !e.touches.length) return;
    const t = e.touches[0], onBtn = btnNo.contains(e.target);
    if (onBtn || nearNo(t.clientX, t.clientY, 44)) { if (onBtn && e.cancelable) e.preventDefault(); flee(t.clientX, t.clientY); }
}, { passive: false, capture: true });
btnNo.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if (e.detail === 0) flee(innerWidth / 2, innerHeight / 2); });
addEventListener('resize', () => { if (Q.free && !Q.exploded && !Q.exploding) { const s = pickSpot(Q.px, Q.py); placeNo(s.x, s.y, 0); } });

function doom() {
    Q.exploding = true; Q.armed = false; freeNo();
    noWrap.dataset.level = 'doom'; noTilt.style.transform = 'none'; Snd.fuse();
    Q.timers.push(setTimeout(explode, 1750));
}
function explode() {
    const r = rectOf(btnNo), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    Snd.boom(); whiteFlash(cx / innerWidth, cy / innerHeight);
    Burst.explode(cx, cy, r.width, r.height);
    const q = $('#s-question'); q.classList.remove('quake'); void q.offsetWidth; q.classList.add('quake');
    noWrap.style.display = 'none'; noSlot.classList.add('gone'); Q.exploded = true; Q.exploding = false;
    btnYes.classList.add('big');
    Q.timers.push(setTimeout(() => { noSlot.style.display = 'none'; q.classList.remove('quake'); }, 900));
}
btnYes.addEventListener('click', () => {
    if (Q.answered || Q.exploding) return;
    Q.answered = true; Q.armed = false; Snd.init(); Snd.pop(); Snd.chime();
    const r = rectOf(btnYes), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    btnYes.classList.remove('big'); btnYes.classList.add('pop');
    $('#s-question').classList.add('yes'); noWrap.classList.add('fade-out');
    Burst.hearts(cx, cy, 70); whiteFlash(cx / innerWidth, cy / innerHeight);
    setTimeout(() => Burst.hearts(innerWidth / 2, innerHeight * .55, 50, 1.3), 400);
    setTimeout(() => Burst.hearts(cx, cy, 40), 800);
    setTimeout(() => go('decl', 'soft'), 1500);
});

/* =====================================================================
   TELAS 6, 7 e 8 — declaração contínua, presente e música
   ===================================================================== */
function playDecl() {
    const root = $('#s-decl'); root.scrollTop = 0;
    if (!('IntersectionObserver' in window)) { $$('.reveal', root).forEach(el => el.classList.add('in')); return; }
    const io = new IntersectionObserver(es => es.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.classList.add('in'); io.unobserve(en.target);
        if (en.target.classList.contains('final')) {
            const r = en.target.getBoundingClientRect(); setTimeout(() => Burst.hearts(r.left + r.width / 2, r.top + r.height / 2, 30, .9), 500);
        }
    }), { root, threshold: .15, rootMargin: '0px 0px -6% 0px' });
    $$('.reveal', root).forEach(el => io.observe(el));
    const io2 = new IntersectionObserver(es => es.forEach(en => stage.classList.toggle('gift-mode', en.isIntersecting)), { root, threshold: .5 });
    io2.observe($('#giftSection'));
    setTimeout(() => $('#declFlow .reveal').classList.add('in'), 250);
}

const Gift = { opened: false };
function openGift() {
    if (Gift.opened) return; Gift.opened = true;
    Snd.init(); const g = $('#gift'), st = $('#giftStage');
    g.classList.remove('idle'); g.classList.add('press'); Snd.pop();
    setTimeout(() => { g.classList.remove('press'); g.classList.add('shake'); Snd.tone(220, 260, .5, 'triangle', .08); }, 180);
    setTimeout(() => {
        g.classList.remove('shake'); g.classList.add('open'); Snd.chime();
        const r = rectOf($('.gift-lid', g)); Burst.sparkle(r.left + r.width / 2, r.top + r.height / 2, 70);
        whiteFlash((r.left + r.width / 2) / innerWidth, (r.top + r.height / 2) / innerHeight);
    }, 850);
    setTimeout(() => {
        const r = rectOf(g); Burst.risingHearts(r.left + r.width / 2, r.top + r.height * .5, 26);
        Burst.sparkle(r.left + r.width / 2, r.top + r.height * .45, 40);
        g.classList.add('done'); st.classList.add('revealed'); $('#giftHint').classList.add('gone');
    }, 1650);
    setTimeout(() => { const s = $('#s-decl'), r = rectOf(st), t = s.scrollTop + r.top - (innerHeight - r.height) / 2; s.scrollTo({ top: t, behavior: 'smooth' }); }, 1900);
}
$('#gift').addEventListener('click', openGift);
$('#gift').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } });
$('#btnListen').addEventListener('click', () => {
    Snd.pop();
    const w = window.open(CONFIG.musica.spotify, '_blank');   // só abre quando ela clica em ESCUTAR (sem autoplay)
    if (w) { try { w.opener = null; } catch (e) {} }
});

/* =====================================================================
   INÍCIO
   ===================================================================== */
function boot() {
    buildTexts(); buildNew(); buildDeclaration(); Bg.init(); Burst.init(); loadEnemy();
    reg('intro', '#s-intro', 'romantic', playIntro);
    reg('challenge', '#s-challenge', 'romantic', playChallenge);
    reg('fps', '#s-fps', 'retro', startFPS, stopFPS);
    reg('win', '#s-win', 'retro', playWin);
    reg('cards', '#s-cards', 'retro', cgEnter, cgLeave);
    reg('mine', '#s-mine', 'retro', mnEnter, mnLeave);
    reg('msg', '#s-msg', 'romantic', playMsg);
    reg('question', '#s-question', 'romantic', playQuestion);
    reg('decl', '#s-decl', 'romantic', playDecl);
    // Atalho de teste (opcional): abra index.html?tela=fps | win | cartas | construcao | mensagem | pergunta | declaracao
    const map = { intro: 'intro', desafio: 'challenge', fps: 'fps', win: 'win', cartas: 'cards', construcao: 'mine', mensagem: 'msg', pergunta: 'question', declaracao: 'decl' };
    const t = map[new URLSearchParams(location.search).get('tela')] || 'intro';
    const s = SCREENS[t]; setMode(s.mode); s.el.classList.add('active'); Nav.cur = t; if (s.onEnter) s.onEnter();
    if (t === 'question') { Q.timers.forEach(clearTimeout); playQuestion(); }
}
boot();
</script>
